<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARA by Shanaya Logo</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
      font-family: Arial, sans-serif;
    }

    .logo-container {
      text-align: center;
    }

    .logo-img {
      width: 420px;
      max-width: 90vw;
      height: auto;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="/logo.jpg" alt="ARA by Shanaya logo" class="logo-img" />
  </div>

</body>
</html>
